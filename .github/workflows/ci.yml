name: CI

on:
  push:
    branches: [master, v1.4]
  pull_request:
  schedule:
    # Nightly extended fuzzing (UTC). Catches what the PR seed corpus cannot.
    - cron: "0 3 * * *"

permissions:
  contents: read

defaults:
  run:
    # Use bash on every OS (including Windows runners) so the shell steps below
    # behave identically across the matrix.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is mandatory: it is the platform whose scheduler historically
        # exposed the timing flakiness this release fixes (FR-8 §8.6).
        os: [ubuntu-latest, windows-latest, macos-latest]
        # go.mod requires 1.21; also exercise the latest stable release.
        go: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Benchmarks (smoke)
        # Compile and run every benchmark once to ensure they stay green.
        run: go test -run '^$' -bench=. -benchmem -benchtime=1x ./...

  coverage:
    name: coverage (per-file floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
      - name: Coverage
        run: |
          # Blackbox tests live in ./tests (package signals_test); -coverpkg attributes
          # their coverage back to the signals package. Whitebox tests in the root
          # contribute too. The union must stay at 100%.
          go test ./... -coverpkg=github.com/maniartech/signals -coverprofile=cover.out -covermode=atomic
          echo "---- per-function coverage ----"
          go tool cover -func=cover.out
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}')
          echo "Total coverage: $total"

  fuzz:
    name: nightly fuzz
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzSyncOps_Model, FuzzConcurrentOps_Race, FuzzAsyncErrorModel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
      - name: Fuzz ${{ matrix.target }}
        # Time-boxed extended fuzzing; any new crash fails the job and the
        # reproducer (written under testdata/fuzz/) should be committed as a
        # permanent regression seed.
        run: go test . -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m
